services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
      POSTGRES_DB: relay
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://relay:relay_local@postgres:5432/relay
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: .
    command: ["node", "scripts/seed.mjs"]
    environment:
      DATABASE_URL: postgresql://relay:relay_local@postgres:5432/relay
      RELAY_DEMO_MODE: "true"
      DEMO_PASSWORD: relay-local-only
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: .
    ports: ["127.0.0.1:4317:3000"]
    environment:
      DATABASE_URL: postgresql://relay:relay_local@postgres:5432/relay
      RELAY_AI_URL: http://ai:4319
      RELAY_AI_KEY: relay-local-ai
      UPLOAD_DIR: /uploads
      RELAY_DEMO_MODE: "true"
    volumes: ["uploads:/uploads"]
    depends_on:
      seed: {condition: service_completed_successfully}
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Relay: Host=postgres;Database=relay;Username=relay;Password=relay_local
      Relay__UploadDir: /uploads
      Relay__ConnectorUrl: http://connector:4321
      Relay__ConnectorKey: relay-local-connector
      Relay__BatchSize: "500"
      Relay__CrashAfterRows: "0"
    volumes: ["uploads:/uploads:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  ai:
    build: {context: ., dockerfile: services/Dockerfile}
    command: ["node", "scripts/ai-service.mjs"]
    restart: unless-stopped
    environment:
      RELAY_AI_KEY: relay-local-ai
      RELAY_BIND: 0.0.0.0
      RELAY_MODEL_CACHE: /models
    volumes: ["models:/models"]
  connector:
    build: {context: ., dockerfile: services/Dockerfile}
    command: ["node", "scripts/test-destination.mjs"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://relay:relay_local@postgres:5432/relay
      RELAY_CONNECTOR_KEY: relay-local-connector
      RELAY_BIND: 0.0.0.0
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres:
  uploads:
  models:
